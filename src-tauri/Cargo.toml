[package]
name = "forge3d"
version = "0.1.0"
description = "Forge3D Studio - local AI 3D generation studio"
edition = "2021"

[lib]
name = "forge3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
fs2 = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
